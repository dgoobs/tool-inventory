{% extends "base.html" %}
{% block title %}Edit: {{ tool.label }}{% endblock %}
{% block content %}
  <h2>Edit checkout: {{ tool.label }}</h2>
  <p class="flash flash-error">Admin override &mdash; corrects the current checkout without a check-in/out cycle.</p>

  <form method="post" class="form-card">
    <label for="employee_name">Employee name</label>
    <input list="employee-list" id="employee_name" name="employee_name" autocomplete="off"
           maxlength="10" value="{{ tool.current_employee }}" required autofocus>
    <datalist id="employee-list">
      {% for name in employees %}<option value="{{ name }}">{% endfor %}
    </datalist>

    <label for="van_number">Van number</label>
    <input list="van-list" id="van_number" name="van_number" autocomplete="off"
           inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3"
           title="Up to 3 digits, numbers only" value="{{ tool.current_van }}" required>
    <datalist id="van-list">
      {% for van in vans %}<option value="{{ van }}">{% endfor %}
    </datalist>

    <div class="form-actions">
      <button class="btn btn-in" type="submit">Save</button>
      <a href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
